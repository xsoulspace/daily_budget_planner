  advertisements across multiple platforms.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.7.0 <4.0.0"

resolution: workspace

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_rustore_billing: ^10.3.1
  freezed_annotation: ^3.1.0
  huawei_iap: ^6.14.0+300
  in_app_purchase: ^3.3.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  universal_io: ^2.3.1
  url_launcher: ^6.3.2
  xsoulspace_foundation: ^0.4.0
  yandex_mobileads: ^8.2.0

dev_dependencies:
  build_runner: ^2.15.2
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  lints: ^6.1.0
  xsoulspace_lints: ^0.1.2

dependency_overrides:
  go_router: ^17.3.0
